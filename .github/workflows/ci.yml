name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm test

  omarchy-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install VM test dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl git imagemagick openssh-client ovmf qemu-system-x86 qemu-utils socat tesseract-ocr tesseract-ocr-eng
          if command -v convert >/dev/null && ! command -v magick >/dev/null; then
            sudo ln -sf "$(command -v convert)" /usr/local/bin/magick
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo mkdir -p /usr/share/edk2/x64
          code="$(find /usr/share -type f -name 'OVMF_CODE_4M.fd' -print -quit)"
          vars="$(find /usr/share -type f -name 'OVMF_VARS_4M.fd' -print -quit)"
          test -n "$code"
          test -n "$vars"
          sudo ln -sf "$code" /usr/share/edk2/x64/OVMF_CODE.4m.fd
          sudo ln -sf "$vars" /usr/share/edk2/x64/OVMF_VARS.4m.fd
          qemu-system-x86_64 --version

      - name: Run real Omarchy + Hyprland smoke test
        env:
          PIXEL_FORGE_SHA: 2516dd8a6dc274a19de86b71cae858d6fdf28ad1
          OMARCHY_ISO_URL: https://iso.omarchy.org/omarchy-4.0.4.iso
        run: bash scripts/omarchy-runtime-smoke.sh

      - name: Upload Omarchy VM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-runtime-evidence
          path: |
            ${{ runner.temp }}/pixel-forge-omarchy/**
          if-no-files-found: ignore
          retention-days: 7
