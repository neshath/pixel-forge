name: Omarchy Quattro runtime

on:
  push:
    branches:
      - test/omarchy-quattro-runtime
  workflow_dispatch:

jobs:
  omarchy-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PIXEL_FORGE_SHA: 51c724fc37bba733afe8811c846eed552fccb655
      OMARCHY_ISO_URL: https://iso.omarchy.org/omarchy-4.0.4.iso
    steps:
      - name: Check out Pixel Forge
        uses: actions/checkout@v4

      - name: Install VM test dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y             curl             git             imagemagick             openssh-client             ovmf             qemu-system-x86             qemu-utils             socat             tesseract-ocr             tesseract-ocr-eng
          if command -v convert >/dev/null && ! command -v magick >/dev/null; then
            sudo ln -sf "$(command -v convert)" /usr/local/bin/magick
          fi
          sudo mkdir -p /usr/share/edk2/x64
          code="$(find /usr/share -type f -name 'OVMF_CODE_4M.fd' -print -quit)"
          vars="$(find /usr/share -type f -name 'OVMF_VARS_4M.fd' -print -quit)"
          test -n "$code"
          test -n "$vars"
          sudo ln -sf "$code" /usr/share/edk2/x64/OVMF_CODE.4m.fd
          sudo ln -sf "$vars" /usr/share/edk2/x64/OVMF_VARS.4m.fd
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          qemu-system-x86_64 --version
          tesseract --version | head -1

      - name: Download and verify Omarchy 4.0.4 ISO
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/omarchy-iso"
          cd "$RUNNER_TEMP/omarchy-iso"
          curl -fsSLo omarchy-4.0.4.iso "$OMARCHY_ISO_URL"
          curl -fsSLo omarchy-4.0.4.iso.sha256 "$OMARCHY_ISO_URL.sha256"
          sha256sum -c omarchy-4.0.4.iso.sha256

      - name: Fetch Omarchy ISO test harness
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch quattro https://github.com/omacom/omarchy-iso.git "$RUNNER_TEMP/omarchy-iso-repo"
          cd "$RUNNER_TEMP/omarchy-iso-repo"
          chmod +x bin/omarchy-iso-test
          # The upstream harness installs its host-side QEMU dependencies with
          # Omarchy's package helper. GitHub-hosted Ubuntu already has them via apt.
          sudo tee /usr/local/bin/omarchy-pkg-add >/dev/null <<'EOF'
          #!/bin/bash
          set -e
          exit 0
          EOF
          sudo chmod +x /usr/local/bin/omarchy-pkg-add

          python3 - <<'PY'
          from pathlib import Path

          path = Path("bin/omarchy-iso-test")
          text = path.read_text()
          anchor = '  log "Installed system is up. Saving base image."'
          injection = r'''  if [[ -n ${PIXEL_FORGE_INSTALL:-} ]]; then
              log "Installing Pixel Forge into the Omarchy base image"
              ssh_guest "echo \$GUEST_PASSWORD | sudo -S pacman -S --noconfirm --needed base-devel git curl nodejs npm rust webkit2gtk-4.1 gtk3 pkgconf patchelf"
              ssh_guest "rm -rf /tmp/pixel-forge-build && mkdir -p /tmp/pixel-forge-build && curl -fsSL -o /tmp/pixel-forge-build/PKGBUILD https://raw.githubusercontent.com/neshath/pixel-forge/test/omarchy-quattro-runtime/packaging/omarchy/PKGBUILD && cd /tmp/pixel-forge-build && makepkg --noconfirm -p PKGBUILD && pkg=\$(ls pixel-forge-0.1.0-1-*.pkg.tar.* | head -1) && echo \$GUEST_PASSWORD | sudo -S pacman -U --noconfirm \"\$pkg\""
          fi

  log "Installed system is up. Saving base image."'''
          if anchor not in text:
              raise SystemExit("Harness anchor not found; upstream omarchy-iso-test changed.")
          path.write_text(text.replace(anchor, injection, 1))
          PY

      - name: Build, install, and run Pixel Forge in real Omarchy
        env:
          PIXEL_FORGE_INSTALL: "1"
        run: |
          set -euxo pipefail

          mkdir -p "$RUNNER_TEMP/omarchy-tests/test/acceptance.d"
          git clone --depth 1 --branch quattro https://github.com/omacom/omarchy.git "$RUNNER_TEMP/omarchy-tests"

          cat > "$RUNNER_TEMP/omarchy-tests/test/acceptance.d/pixel-forge-test.sh" <<'EOF'
          #!/bin/bash
          set -euo pipefail

          source "$(dirname "$0")/base-test.sh"

          require_command hyprctl
          require_command jq
          require_command pgrep
          require_command grim

          if pacman -Q pixel-forge >/dev/null 2>&1; then
            pass "Pixel Forge package is installed"
          else
            fail "Pixel Forge package is installed"
          fi

          if [[ -x /usr/bin/pixel-forge ]]; then
            pass "Pixel Forge executable is present at /usr/bin/pixel-forge"
          else
            fail "Pixel Forge executable is present at /usr/bin/pixel-forge"
          fi

          launch_app 'env GDK_BACKEND=wayland /usr/bin/pixel-forge >/tmp/pixel-forge.log 2>&1'

          if wait_until "Pixel Forge opens a Hyprland window" 45 window_present "pixel-forge"; then
            :
          else
            cat /tmp/pixel-forge.log >&2 || true
            exit 1
          fi

          client="$(hyprctl -j clients | jq -e '[.[] | select(.class | test("pixel-forge"; "i"))][0]')"

          echo "$client" | jq -e '(.xwayland // false) == false' >/dev/null ||
            fail "Pixel Forge is a native Wayland client"

          echo "$client" | jq -e '.title == "Pixel Forge — Retro Game Studio"' >/dev/null ||
            fail "Pixel Forge window title is correct"

          pid="$(echo "$client" | jq -r '.pid // empty')"
          [[ -n "$pid" ]] ||
            fail "Hyprland exposes a Pixel Forge process id"

          kill -0 "$pid" 2>/dev/null ||
            fail "Pixel Forge process remains alive after window mapping"

          grep -zq "WAYLAND_DISPLAY=" "/proc/$pid/environ" ||
            fail "Pixel Forge inherited a Wayland display"

          screenshot "success-pixel-forge-wayland-window"

          close_windows "pixel-forge"
          wait_until "Pixel Forge window closes cleanly" 20 window_absent "pixel-forge"
          pass "Pixel Forge closes cleanly under Hyprland"
          EOF

          chmod +x "$RUNNER_TEMP/omarchy-tests/test/acceptance.d/pixel-forge-test.sh"

          cd "$RUNNER_TEMP/omarchy-iso-repo"
          ./bin/omarchy-iso-test             "$RUNNER_TEMP/omarchy-iso/omarchy-4.0.4.iso"             --no-preview             --sync-omarchy "$RUNNER_TEMP/omarchy-tests"             --memory 8192             --timeout 2400

      - name: Upload Omarchy VM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-quattro-pixel-forge-runtime
          path: |
            ${{ runner.temp }}/omarchy-iso-repo/test-runs/**
          if-no-files-found: ignore
          retention-days: 7
