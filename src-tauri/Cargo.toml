[package]
name = "pixel-forge"
version = "1.0.1"
description = "A local retro game creation studio"
authors = ["Pixel Forge contributors"]
edition = "2021"

[lib]
name = "pixel_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
